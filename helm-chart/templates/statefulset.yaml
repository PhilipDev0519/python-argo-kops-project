apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-stateful
spec:
  serviceName: {{ .Release.Name }}
  replicas: 2
  selector:
    matchLabels:
      app: {{ .Release.Name }}-stateful
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-stateful
    spec:
      containers:
      - name: python
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 5000
